name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt, clippy, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # no toolchain step: rustup reads ./rust-toolchain.toml on the first cargo call
      - name: Toolchain must match rust-toolchain.toml
        run: |
          pinned="$(sed -n 's/^ *channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          actual="$(rustc --version | cut -d' ' -f2)"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::rust-toolchain.toml pins ${pinned}, but rustc is ${actual}"
            exit 1
          fi
          echo "running the pinned toolchain: ${actual}"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: just ci
        run: just ci
