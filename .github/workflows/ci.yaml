name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt, clippy, test, build (${{ matrix.os }})
    # Both legs run the identical `just ci`: the gate has to cover every platform
    # release.yaml publishes a binary for, and splitting stages by platform would put a
    # judgement about which of them are portable back into the workflow.
    strategy:
      # every platform's problems on a single run, as in release.yaml's build matrix
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # the stages and their flags live in ./justfile, so a local `just ci` runs
      # exactly what CI runs
      - name: just ci
        run: just ci
