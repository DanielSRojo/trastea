name: Release

on:
  push:
    tags: ["v*"]

# Required for creating a release
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # pinned so a release cannot start emitting different notices than the one before it
  CARGO_ABOUT_VERSION: "0.9.2"

jobs:
  # Fails the release before anything is built so a bad tag never produces a release.
  guard:
    name: Verify tag and run the gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install just
        uses: extractions/setup-just@v4

      - uses: Swatinem/rust-cache@v2

      - name: Tag must match the Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version ${tag}, but Cargo.toml says ${crate}"
            exit 1
          fi
          echo "tag and Cargo.toml agree on ${crate}"

      - name: just ci
        run: just ci

      # about.toml resolves both release targets at once, so the notices are the same
      # file on either platform. Generating here rather than in each build job keeps
      # the cargo-about install off the macOS runner and out of the matrix.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version "${CARGO_ABOUT_VERSION}"

      - name: just notices
        run: just notices

      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      # Build every target to show all problems on a single run
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            os: ubuntu-latest
          - name: aarch64-macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: just build-release

      - uses: actions/download-artifact@v8
        with:
          name: notices

      # The fonts and the Rust crates are all compiled into the binary, so the
      # binary redistributes them: GPLv3 section 4, OFL 1.1 clause 2, and MIT's
      # and Apache-2.0's notice clauses each require their license text to travel
      # with the copy, which is why the archive is a staged directory rather than
      # the bare executable.
      - name: Package tarball
        if: matrix.os == 'ubuntu-latest'
        run: |
          stage="trastea-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p dist "${stage}"
          cp target/release/trastea "${stage}/"
          cp LICENSE "${stage}/"
          cp assets/fonts/OFL.txt "${stage}/LICENSE-fonts.txt"
          cp THIRD-PARTY-NOTICES.txt "${stage}/"
          tar -czf "dist/${stage}.tar.gz" "${stage}"

      - name: Package .app bundle
        if: matrix.os == 'macos-latest'
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="Trastea.app"
          mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
          cp target/release/trastea "${app}/Contents/MacOS/trastea"

          # Same obligation as the tarball; Resources/ is where a bundle
          # conventionally carries them.
          cp LICENSE "${app}/Contents/Resources/LICENSE"
          cp assets/fonts/OFL.txt "${app}/Contents/Resources/LICENSE-fonts.txt"
          cp THIRD-PARTY-NOTICES.txt "${app}/Contents/Resources/"

          # NSHighResolutionCapable is not optional in practice: without it
          # macOS runs the app scaled and it renders blurry on Retina.
          cat > "${app}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Trastea</string>
            <key>CFBundleDisplayName</key><string>Trastea</string>
            <key>CFBundleIdentifier</key><string>io.github.danielsrojo.trastea</string>
            <key>CFBundleExecutable</key><string>trastea</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          plutil -lint "${app}/Contents/Info.plist"

          # ditto, not zip: it preserves the executable bit and bundle
          # metadata that macOS needs to launch the app.
          mkdir -p dist
          ditto -c -k --keepParent "${app}" \
            "dist/trastea-${GITHUB_REF_NAME}-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Collecting every archive before publishing to avoid racing on the same tag
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `archive-*` and not everything: the notices artifact is an input to the
      # build jobs and already sits inside each archive, so pulling it in here
      # would publish a loose copy that SHA256SUMS does not cover.
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum trastea-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
