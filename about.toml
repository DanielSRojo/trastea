# cargo-about walks the dependency graph and collects the licence of every crate
# compiled into the binary. `just notices` renders THIRD-PARTY-NOTICES.txt from it,
# and the release workflow stages that file beside LICENSE and LICENSE-fonts.txt.

# Order is preference, not just permission: for a crate that offers a choice —
# self_cell is `Apache-2.0 OR GPL-2.0-only`, r-efi is `MIT OR Apache-2.0 OR
# LGPL-2.1-or-later` — cargo-about takes the first id listed here. GPL-2.0-only and
# LGPL-2.1-or-later are deliberately absent so the permissive branch is the one
# taken; GPL-2.0-only in particular cannot be combined with Trastea's own
# GPL-3.0-or-later, so accepting it would manufacture a conflict that the crate's
# own dual licence exists to avoid.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]

# Only the two targets the release workflow actually builds. Without this the graph
# also resolves windows- and uefi-only crates, and the notices would name code that
# never reached the user holding the file.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

# Neither is linked into the shipped executable — build scripts and proc macros run
# at compile time and dev-dependencies only build the tests — so their notices do
# not have to travel with the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Trastea is `publish = false`, and this drops it from its own notices. Without it the
# root crate is collected as though it were a third party: the GPL text then ships
# twice — once as LICENSE, once here — and contradicts the header about.hbs writes,
# which tells the reader that nothing on the page is Trastea's own.
[private]
ignore = true
